<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vecorion Voz e Vídeo</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0b0d22;color:#eef0ff;padding:18px;max-width:640px;margin:auto}
  h1{font-size:22px;margin-bottom:4px}
  .sub{color:#9aa0d0;font-size:14px;margin-bottom:18px}
  .card{background:#161a3a;border:1px solid #2a2f63;border-radius:16px;padding:14px;margin-bottom:12px}
  label{font-size:12px;color:#9aa0d0;display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
  select,textarea,input{width:100%;background:#0b0d22;color:#eef0ff;border:1px solid #2a2f63;border-radius:10px;padding:10px;font-size:16px;font-family:inherit}
  textarea{min-height:84px;resize:vertical}
  .row{display:flex;gap:10px}.row>div{flex:1}
  button{background:#ffb347;color:#1b1030;border:0;border-radius:12px;padding:13px 16px;font-size:16px;font-weight:700;width:100%;margin-top:10px}
  button.sec{background:#2a2f63;color:#eef0ff}
  button:disabled{opacity:.5}
  .cena{font-size:13px;color:#ffb347;font-weight:700;margin-bottom:6px}
  .meta{font-size:12px;color:#9aa0d0;margin-top:6px}
  audio{width:100%;margin-top:10px}
  #status,#vStatus{font-size:14px;margin:10px 0;min-height:20px}
  .erro{color:#ff7a7a}.ok{color:#7dffb0}
  a.dl{display:block;text-align:center;background:#7dffb0;color:#0b2a18;border-radius:12px;padding:13px;font-weight:700;text-decoration:none;margin-top:10px}
  /* abas */
  .abas{display:flex;gap:8px;margin-bottom:16px}
  .abas button{margin-top:0;background:#161a3a;color:#9aa0d0;border:1px solid #2a2f63}
  .abas button.ativa{background:#ffb347;color:#1b1030;border-color:#ffb347}
  .aba{display:none}.aba.ativa{display:block}
  /* vídeo */
  video{width:100%;border-radius:12px;margin-top:10px;background:#000}
  #vPrev{width:100%;max-height:260px;object-fit:contain;border-radius:10px;margin-top:10px;display:none}
  input[type=file]{padding:8px}
</style>
</head>
<body>
<h1>Vecorion Voz e Vídeo</h1>
<p class="sub">Voz pela OpenAI · Vídeo pelo Google (Gemini)</p>

<div class="abas">
  <button id="tabVoz" class="ativa">Voz</button>
  <button id="tabVideo">Vídeo</button>
</div>

<!-- ============ ABA VOZ ============ -->
<div id="abaVoz" class="aba ativa">

<div class="card">
  <div class="row">
    <div><label>Voz</label>
      <select id="voz">
        <option value="onyx" selected>Onyx (grave)</option>
        <option value="echo">Echo</option>
        <option value="ash">Ash</option>
        <option value="ballad">Ballad</option>
        <option value="cedar">Cedar</option>
        <option value="alloy">Alloy</option>
        <option value="fable">Fable</option>
        <option value="verse">Verse</option>
      </select></div>
    <div><label>Modelo</label>
      <select id="modelo">
        <option value="gpt-4o-mini-tts" selected>gpt-4o-mini-tts</option>
        <option value="tts-1">tts-1</option>
        <option value="tts-1-hd">tts-1-hd</option>
      </select></div>
  </div>
  <div style="margin-top:10px"><label>Velocidade: <span id="vv">1.00</span>x</label>
    <input type="range" id="vel" min="0.8" max="1.3" step="0.05" value="1"></div>
</div>

<div id="falas"></div>

<button id="todas">Gerar as 6 falas</button>
<div id="status"></div>

<div class="card" id="final" style="display:none">
  <label>Narração completa (6 falas encaixadas no tempo do vídeo, 36 s)</label>
  <audio id="audioFinal" controls></audio>
  <a class="dl" id="baixar" download="narracao_completa.wav">Baixar narração completa (WAV)</a>
  <button class="sec" id="baixarMp3s">Baixar as 6 falas separadas</button>
</div>

</div>

<!-- ============ ABA VÍDEO ============ -->
<div id="abaVideo" class="aba">

<div class="card">
  <label>Sua ideia</label>
  <textarea id="vIdeia" placeholder="Ex.: um homem acordando de manhã, bebendo água perto da janela e sorrindo"></textarea>
  <div style="margin-top:10px">
    <label>Imagem (opcional, vira o primeiro quadro)</label>
    <input type="file" id="vImg" accept="image/*">
    <img id="vPrev" alt="Prévia da imagem">
    <button class="sec" id="vTirarImg" style="display:none">Tirar a imagem</button>
  </div>
  <div style="margin-top:10px">
    <label>Formato</label>
    <select id="vProp">
      <option value="9:16" selected>Vertical (9:16) — Reels e Stories</option>
      <option value="16:9">Horizontal (16:9)</option>
    </select>
  </div>
  <button class="sec" id="vMelhorar">Melhorar a ideia com o Gemini</button>
</div>

<div class="card">
  <label>Prompt final (você pode editar)</label>
  <textarea id="vPrompt" style="min-height:160px" placeholder="Toque em “Melhorar a ideia com o Gemini” ou escreva aqui o prompt pronto. Se deixar vazio, o Gemini melhora sozinho na hora de gerar."></textarea>
  <div class="meta">O Gemini cria um clipe curto (cerca de 8 a 10 segundos) já com som e fala. Escreva a fala entre aspas.</div>
</div>

<button id="vGerar">Gerar vídeo</button>
<div id="vStatus"></div>

<div class="card" id="vFinal" style="display:none">
  <label>Seu vídeo</label>
  <video id="vPlayer" controls playsinline></video>
  <a class="dl" id="vBaixar" download="video_vecorion.mp4">Baixar vídeo (MP4)</a>
</div>

</div>

<script>
const $ = id => document.getElementById(id);

// ---------- abas ----------
function abrirAba(qual){
  $("abaVoz").classList.toggle("ativa", qual==="voz");
  $("abaVideo").classList.toggle("ativa", qual==="video");
  $("tabVoz").classList.toggle("ativa", qual==="voz");
  $("tabVideo").classList.toggle("ativa", qual==="video");
  window.scrollTo(0,0);
}
$("tabVoz").onclick = () => abrirAba("voz");
$("tabVideo").onclick = () => abrirAba("video");

// =====================================================
//                       VOZ (OpenAI)
// =====================================================
const FALAS = [
  {inicio:0.3,  janela:3.5, cena:"Cena 1 · gancho",        texto:"Antes de pegar o celular, escuta isso."},
  {inicio:4.3,  janela:5.5, cena:"Cena 2 · ondas cerebrais", texto:"Na primeira hora depois de acordar, seu cérebro está no estado mais programável do dia."},
  {inicio:10.3, janela:7.4, cena:"Cena 3 · celular",        texto:"Olhou o celular? Você treinou ansiedade. Rolou as redes? Programou comparação."},
  {inicio:18.3, janela:9.4, cena:"Cena 4 · sol e ícones",   texto:"Em vez disso, beba água, respire cinco minutos, mexa o corpo e defina uma intenção."},
  {inicio:28.2, janela:4.2, cena:"Cena 5 · relógio",        texto:"Você está programando as próximas dezesseis horas."},
  {inicio:32.6, janela:3.3, cena:"Cena 6 · frase final",    texto:"A primeira hora determina o dia. Escolha com cuidado."},
];
const TOTAL = 36, SR = 44100;
const buffers = new Array(FALAS.length).fill(null);   // AudioBuffer de cada fala
const blobsMp3 = new Array(FALAS.length).fill(null);

$("vel").oninput = () => $("vv").textContent = Number($("vel").value).toFixed(2);

// monta os cartões
FALAS.forEach((f,i)=>{
  const d = document.createElement("div"); d.className="card";
  d.innerHTML = `<div class="cena">${f.cena} · começa em ${f.inicio}s</div>
    <textarea id="t${i}">${f.texto}</textarea>
    <div class="meta" id="m${i}">Janela máxima: ${f.janela}s</div>
    <audio id="a${i}" controls style="display:none"></audio>
    <button class="sec" id="b${i}">Gerar só esta fala</button>`;
  $("falas").appendChild(d);
  $("b"+i).onclick = () => gerar(i);
});

function status(msg, cls){ const s=$("status"); s.textContent=msg; s.className=cls||""; }

function b64ToBlob(b64, tipo){
  const bin = atob(b64), n = bin.length, u = new Uint8Array(n);
  for(let i=0;i<n;i++) u[i]=bin.charCodeAt(i);
  return new Blob([u], {type:tipo});
}

async function gerar(i){
  const texto = $("t"+i).value.trim();
  if(!texto){ status("A fala "+(i+1)+" está vazia.","erro"); return; }
  $("b"+i).disabled = true; status("Gerando fala "+(i+1)+"...");
  try{
    const r = await fetch("/.netlify/functions/voz", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({texto, voz:$("voz").value, modelo:$("modelo").value, velocidade:Number($("vel").value)})
    });
    const j = await r.json();
    if(!r.ok) throw new Error(j.erro || ("Erro "+r.status));
    const blob = b64ToBlob(j.mp3, "audio/mpeg");
    blobsMp3[i] = blob;
    const ab = await blob.arrayBuffer();
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    buffers[i] = await ctx.decodeAudioData(ab);
    ctx.close();
    const au = $("a"+i); au.src = URL.createObjectURL(blob); au.style.display="block";
    const dur = buffers[i].duration, jan = FALAS[i].janela;
    $("m"+i).innerHTML = `Duração: ${dur.toFixed(1)}s · janela: ${jan}s ` + (dur>jan+0.3
      ? `<span class="erro">(passou — será acelerada ${Math.min(1.25,dur/jan).toFixed(2)}x na montagem)</span>` : `<span class="ok">(cabe)</span>`);
    status("Fala "+(i+1)+" pronta.","ok");
    return true;
  }catch(e){ status("Erro na fala "+(i+1)+": "+e.message,"erro"); return false; }
  finally{ $("b"+i).disabled=false; montarFinal(); }
}

$("todas").onclick = async () => {
  $("todas").disabled = true;
  for(let i=0;i<FALAS.length;i++){ const ok = await gerar(i); if(ok===false) break; }
  $("todas").disabled = false;
  if(buffers.every(Boolean)) status("Tudo pronto! Role para baixo para baixar.","ok");
};

// mistura as falas na linha do tempo de 36 s, acelerando (até 1.25x) as que passam da janela
async function montarFinal(){
  if(!buffers.every(Boolean)) return;
  const off = new OfflineAudioContext(1, SR*TOTAL, SR);
  buffers.forEach((buf,i)=>{
    const src = off.createBufferSource(); src.buffer = buf;
    const jan = FALAS[i].janela;
    if(buf.duration > jan) src.playbackRate.value = Math.min(1.25, buf.duration/jan);
    src.connect(off.destination); src.start(FALAS[i].inicio);
  });
  const out = await off.startRendering();
  const wav = audioBufferToWav(out);
  const url = URL.createObjectURL(wav);
  $("audioFinal").src = url; $("baixar").href = url;
  $("final").style.display = "block";
}

function audioBufferToWav(buf){
  const ch = buf.getChannelData(0), n = ch.length, ab = new ArrayBuffer(44+n*2), v = new DataView(ab);
  const w = (o,s)=>{for(let i=0;i<s.length;i++) v.setUint8(o+i,s.charCodeAt(i));};
  w(0,"RIFF"); v.setUint32(4,36+n*2,true); w(8,"WAVE"); w(12,"fmt ");
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,buf.sampleRate,true); v.setUint32(28,buf.sampleRate*2,true);
  v.setUint16(32,2,true); v.setUint16(34,16,true); w(36,"data"); v.setUint32(40,n*2,true);
  let o=44; for(let i=0;i<n;i++){ const s=Math.max(-1,Math.min(1,ch[i])); v.setInt16(o, s<0?s*0x8000:s*0x7FFF, true); o+=2; }
  return new Blob([ab],{type:"audio/wav"});
}

$("baixarMp3s").onclick = () => {
  blobsMp3.forEach((b,i)=>{ if(!b) return;
    const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download="fala_"+(i+1)+".mp3";
    document.body.appendChild(a); setTimeout(()=>{a.click();a.remove();}, i*400); });
};

// =====================================================
//                  VÍDEO (Google: Gemini)
// =====================================================
let imgB64 = null, imgMime = "image/jpeg";
const dormir = ms => new Promise(r => setTimeout(r, ms));

function vStatus(msg, cls){ const s=$("vStatus"); s.textContent=msg; s.className=cls||""; }

// reduz a imagem para caber no limite da função (máx. 1280 px, JPEG)
$("vImg").onchange = async e => {
  const f = e.target.files[0];
  if(!f){ tirarImagem(); return; }
  try{
    const url = URL.createObjectURL(f);
    const im = new Image();
    await new Promise((ok,fail)=>{ im.onload=ok; im.onerror=fail; im.src=url; });
    const esc = Math.min(1, 1280/Math.max(im.width, im.height));
    const c = document.createElement("canvas");
    c.width = Math.round(im.width*esc); c.height = Math.round(im.height*esc);
    c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
    const dataUrl = c.toDataURL("image/jpeg", 0.85);
    imgB64 = dataUrl.split(",")[1]; imgMime = "image/jpeg";
    $("vPrev").src = dataUrl; $("vPrev").style.display = "block";
    $("vTirarImg").style.display = "block";
    URL.revokeObjectURL(url);
  }catch(err){ tirarImagem(); vStatus("Não consegui abrir essa imagem.","erro"); }
};
function tirarImagem(){
  imgB64 = null; $("vImg").value = "";
  $("vPrev").style.display = "none"; $("vTirarImg").style.display = "none";
}
$("vTirarImg").onclick = tirarImagem;

async function chamarVideo(corpo){
  const r = await fetch("/.netlify/functions/video", {
    method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(corpo)
  });
  let j;
  try{ j = await r.json(); }
  catch{ throw new Error("A função não respondeu direito (pode ter passado do tempo limite ou não está publicada)."); }
  if(!r.ok) throw new Error(j.erro || ("Erro "+r.status));
  return j;
}

async function melhorar(){
  const ideia = $("vIdeia").value.trim();
  if(!ideia && !imgB64) throw new Error("Escreva a ideia ou envie uma imagem.");
  const j = await chamarVideo({acao:"melhorar", ideia, imagem:imgB64, mimeType:imgMime});
  $("vPrompt").value = j.prompt;
  return j.prompt;
}

$("vMelhorar").onclick = async () => {
  $("vMelhorar").disabled = true; vStatus("O Gemini está escrevendo o prompt...");
  try{ await melhorar(); vStatus("Prompt pronto. Edite se quiser e toque em Gerar vídeo.","ok"); }
  catch(e){ vStatus("Erro: "+e.message,"erro"); }
  finally{ $("vMelhorar").disabled = false; }
};

$("vGerar").onclick = async () => {
  $("vGerar").disabled = true; $("vMelhorar").disabled = true;
  $("vFinal").style.display = "none";
  try{
    let prompt = $("vPrompt").value.trim();
    if(!prompt){ vStatus("O Gemini está escrevendo o prompt..."); prompt = await melhorar(); }

    vStatus("Enviando para o Google...");
    const ini = await chamarVideo({acao:"iniciar", prompt, imagem:imgB64, mimeType:imgMime, proporcao:$("vProp").value});

    const t0 = Date.now(); let mp4 = null;
    while(Date.now() - t0 < 6*60*1000){
      await dormir(8000);
      const seg = Math.round((Date.now()-t0)/1000);
      vStatus("Gerando o vídeo... "+seg+"s (costuma levar de 1 a 4 minutos). Não feche esta página.");
      const st = await chamarVideo({acao:"status", operacao:ini.operacao});
      if(st.pronto){ if(st.erro) throw new Error(st.erro); mp4 = st.mp4; break; }
    }
    if(!mp4) throw new Error("Passou de 6 minutos sem ficar pronto. Tente de novo.");

    const url = URL.createObjectURL(b64ToBlob(mp4, "video/mp4"));
    $("vPlayer").src = url; $("vBaixar").href = url;
    $("vFinal").style.display = "block";
    vStatus("Vídeo pronto! Role para baixo para ver e baixar.","ok");
  }catch(e){ vStatus("Erro: "+e.message,"erro"); }
  finally{ $("vGerar").disabled = false; $("vMelhorar").disabled = false; }
};
</script>
</body>
</html>
